# JianArtifact 后端服务 crate
# 阶段 1（ADR-0014）：服务基座 + auth 域契约骨架；handler 返回未实现，业务逻辑随阶段 3 落地。

[package]
name = "jianartifact-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jianartifact_server"
path = "src/lib.rs"

[[bin]]
name = "jianartifact"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
embedded-web = ["dep:rust-embed"]

[dependencies]
# Web 框架与异步运行时
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "io-util", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
# 序列化与请求/响应模型
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.41", features = ["serialize"] }
rust-embed = { version = "8", optional = true }
# OpenAPI 契约生成（ADR-0012 唯一真源）
utoipa = { version = "5", features = ["axum_extras"] }
# 配置加载（TOML + 环境变量覆盖）
figment = { version = "0.10", features = ["toml", "env"] }
# 中文分级日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# 元数据库（SQLite bundled，纯 Rust，迁移框架）
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# 统一错误类型
thiserror = "2"
# 口令哈希（Argon2id，RustCrypto 纯 Rust，无系统级 C 库）
argon2 = "0.5"
# JWT HS256 会话令牌签发与验签
jsonwebtoken = "9"
# 安全随机数：API Token 明文与 Argon2 盐
rand = "0.8"
# SHA-256：会话撤销、API Token 与 blob 摘要
sha2 = "0.10"
# 制品摘要与内容类型识别
sha1 = "0.10"
md-5 = "0.10"
mime_guess = "2"
# blob 增量 IO、磁盘阈值与生产响应体工具
tokio-util = { version = "0.7", features = ["io"] }
fs4 = "1.1"
http-body-util = "0.1"
# proxy 上游客户端：rustls、响应流与禁重定向策略
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[dev-dependencies]
# 集成测试：驱动 Router 处理请求、读取响应体、临时数据目录
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
