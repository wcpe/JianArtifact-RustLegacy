# 发布工作流（FR-86）：
# - push master ⇒ prerelease（开发版快照，滚动 tag `dev`，版本 {cargo版本}-dev.{run_number}.{shortsha}）
# - push tag `v*` ⇒ 正式 Release（版本取 tag 去前导 v）
# 三目标各用原生 runner 编译（免交叉编译），产出按命名契约重命名的二进制 + 每资产一份 .sha256。
# 资产命名契约（FR-85 消费）：jianartifact-{version}-{target}{ext} 及其 .sha256
#   {ext}：Windows 为 .exe，Linux / macOS 为空。
name: Release

# 触发：push 到 master（出 prerelease），或 push v* tag（出正式 Release）。
on:
  push:
    branches: [master]
    tags: ['v*']

# 并发控制：同一 ref 串行，避免并发发布相互覆盖资产。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 仅授予写 Release 所需的最小权限；凭据用内置 GITHUB_TOKEN，不入库任何密钥。
permissions:
  contents: write

jobs:
  # 第一步：统一推导版本号与发布渠道参数，供后续矩阵与发布步骤复用（单一真源）。
  prepare:
    name: 推导版本与发布渠道
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本与渠道
        id: meta
        shell: bash
        run: |
          # 从 Cargo.toml 读取 version（二进制经 clap version 由 CARGO_PKG_VERSION 注入，二者一致）。
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 正式 Release：版本取 tag 去前导 v，发布 tag 即该 tag，非预发布。
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            prerelease="false"
          else
            # 开发版快照：版本 {cargo版本}-dev.{run_number}.{shortsha}，滚动 tag dev，预发布。
            # 用 '.' 连接 shortsha（而非 '+' 构建元数据）：GitHub 上传 Release 资产时会把资产名里的
            # '+' 改写成 '.'，导致自更新按含 '+' 的版本重构的期望资产名匹配不到。点分形态仍是合法的
            # SemVer 预发布标识（dev.N.sha），资产名与 GitHub 存储一致，自更新可精确匹配。
            short_sha="${GITHUB_SHA:0:7}"
            version="${cargo_version}-dev.${GITHUB_RUN_NUMBER}.${short_sha}"
            tag="dev"
            prerelease="true"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      # 清理旧 dev 滚动预发布从 publish 前移：draft release 既是产物通道
      # 又是最终载体，须在创建 draft 前清掉旧 dev（避免旧资产混入新发布）。
      - name: 清理旧 dev 预发布（避免资产堆积）
        if: steps.meta.outputs.prerelease == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true

      # draft release 产物通道：同 run 跨 job cache 传产物实测不可靠，
      # 改走 draft release 资产；draft 对外不可见，publish 校验齐备后发布。
      - name: 创建 draft release 作为产物通道
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q '^true$'; then
            echo "复用已有 draft release ${TAG_NAME}"
          elif gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG_NAME} 已存在且非 draft，拒绝污染" >&2
            exit 1
          else
            args=(--draft --title "${TAG_NAME}" --notes "release pipeline in progress")
            [ "${IS_PRERELEASE}" = "true" ] && args+=(--prerelease)
            gh release create "${TAG_NAME}" "${args[@]}"
          fi

  # 第二步：三目标矩阵各自原生 runner 编译，产出按命名契约重命名的二进制 + .sha256，上传为构件。
  build:
    name: 构建 ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64：musl 静态链接（不依赖 glibc、跨发行版可跑），无扩展名。
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            ext: ''
          # Windows x86_64（MSVC）：原生 windows，扩展名 .exe。
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            ext: '.exe'
          # macOS arm64（Apple Silicon）：原生 macos-14（Apple Silicon runner），无扩展名。
          - target: aarch64-apple-darwin
            runner: macos-14
            ext: ''
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl 静态链接需 musl-gcc 编译 C 依赖（bundled sqlite / ring）；仅 Linux musl 目标装。
      - name: 安装 musl 工具链（仅 Linux musl 目标）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 安装前端依赖
        run: pnpm -C frontend install --frozen-lockfile

      # 开源许可清单扫描工具（FR-102，ADR-0025）：构建期 CLI，非项目运行时依赖。
      - name: 安装 cargo-about
        run: cargo install cargo-about --locked --features cli

      # 生成开源许可清单（Rust crates + 前端 npm，运行时 + 开发依赖）写入 src/licenses，
      # 供后端 include_str! 编译期嵌入。须在编译二进制前跑（依赖已装 cargo-about 与前端 node_modules）。
      - name: 生成开源许可清单
        run: node scripts/gen-licenses.mjs

      # 先建前端，产出 frontend/dist 供 rust-embed 嵌入（构建顺序硬约束）。
      - name: 构建前端
        run: pnpm -C frontend build

      # 默认特性发布构建（不启用 s3，守单一二进制零外部运行时依赖）。
      - name: 编译 release 二进制
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # 注入完整版本串（prerelease=dev.N.sha / tag=版本）到二进制，使其自报真实发布版本。
          # 编译期由 option_env! 读入（见 src/version.rs），修复 prerelease 自更新「当前版本」不收敛。
          JIANARTIFACT_BUILD_VERSION: ${{ needs.prepare.outputs.version }}

      # 按命名契约重命名二进制 + 生成 .sha256（裸 64 位十六进制串，不带文件名）。
      # 同时打包压缩包（FR-138：三平台统一 zip，规避杀软对裸 musl ELF 的启发式误报）
      # 并生成 zip 的 .sha256 / .md5 校验和文件；过渡版同时保留裸可执行（兼容旧版自更新）。
      # 用 bash（windows runner 也用 git bash）统一处理三平台路径与哈希工具差异。
      - name: 打包资产与校验和
        id: pack
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          ext="${{ matrix.ext }}"
          # cargo 产物路径：target/{triple}/release/jianartifact{ext}
          src="target/${target}/release/jianartifact${ext}"
          asset="jianartifact-${version}-${target}${ext}"
          zip_asset="jianartifact-${version}-${target}.zip"
          mkdir -p dist
          cp "$src" "dist/${asset}"

          # 裸 exe sha256（过渡保留：供旧版自更新回落路径校验）
          if command -v sha256sum >/dev/null 2>&1; then
            sha=$(sha256sum "dist/${asset}" | awk '{print $1}')
          else
            sha=$(shasum -a 256 "dist/${asset}" | awk '{print $1}')
          fi
          printf '%s' "$sha" > "dist/${asset}.sha256"

          # 打包压缩包（FR-138）：zip 内只放二进制本体、不保留目录路径。
          # Windows runner 的 Git bash 无 unix `zip`，回落 `7z`（GitHub runner 自带）；
          # 均在 dist 子 shell 内按 basename 打包，保证压缩包内为扁平结构（等价 zip -j）。
          if command -v zip >/dev/null 2>&1; then
            ( cd dist && zip -j "${zip_asset}" "${asset}" )
          elif command -v 7z >/dev/null 2>&1; then
            ( cd dist && 7z a -tzip "${zip_asset}" "${asset}" >/dev/null )
          else
            echo "未找到 zip 或 7z 打包工具" >&2
            exit 1
          fi

          # zip sha256
          if command -v sha256sum >/dev/null 2>&1; then
            zip_sha=$(sha256sum "dist/${zip_asset}" | awk '{print $1}')
          else
            zip_sha=$(shasum -a 256 "dist/${zip_asset}" | awk '{print $1}')
          fi
          printf '%s' "$zip_sha" > "dist/${zip_asset}.sha256"

          # zip md5（供下载方可选校验）
          if command -v md5sum >/dev/null 2>&1; then
            zip_md5=$(md5sum "dist/${zip_asset}" | awk '{print $1}')
          else
            zip_md5=$(md5 -q "dist/${zip_asset}")
          fi
          printf '%s' "$zip_md5" > "dist/${zip_asset}.md5"

          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "zip_asset=${zip_asset}" >> "$GITHUB_OUTPUT"

      # 上传该目标的全部资产到 draft release（跨 job 产物通道），
      # 交由 publish job 校验齐备后发布。
      - name: 上传构建产物到 draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG_NAME}"             "dist/${{ steps.pack.outputs.asset }}"             "dist/${{ steps.pack.outputs.asset }}.sha256"             "dist/${{ steps.pack.outputs.zip_asset }}"             "dist/${{ steps.pack.outputs.zip_asset }}.sha256"             "dist/${{ steps.pack.outputs.zip_asset }}.md5"             --clobber

  # 第三步：汇总三目标资产，按渠道发布为 GitHub Release（prerelease 或正式）。
  publish:
    name: 发布 Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      # 下载全部目标构件并校验齐备（15 件 = 3 目标 × 5 资产）。
      - name: 下载全部构建产物并校验
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "${TAG_NAME}" -D dist --clobber
          count="$(find dist -type f | wc -l)"
          [ "${count}" -eq 15 ] || { echo "::error::资产不齐：期望 15 件，实得 ${count}"; find dist -type f; exit 1; }
          ls -l dist/

      # 发布 draft release：转正并改名（draft 由 prepare 建、资产由各格上传）。
      - name: 发布 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "${TAG_NAME}" --draft=false --title "${VERSION}"

  # ── 收尾：半成品 draft 不残留（失败/中断时清理；dev 渠道删 draft 不删 tag） ──
  cleanup-draft:
    needs: [prepare, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 清理未发布的 draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          [ -n "${TAG_NAME}" ] || exit 0
          if gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q '^true$'; then
            # dev 渠道删掉 tag 一起清（滚动 tag 归本次发布独占）；v* 保留 tag。
            if [ "${IS_PRERELEASE}" = "true" ]; then
              gh release delete "${TAG_NAME}" -y --cleanup-tag
            else
              gh release delete "${TAG_NAME}" -y
            fi
            echo "已清理残留 draft release ${TAG_NAME}"
          else
            echo "无残留 draft（已发布或未创建）"
          fi
